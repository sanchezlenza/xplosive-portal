<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Xplosive Dance Company</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .tabs{ display:flex; gap:10px; margin-bottom:28px; flex-wrap:wrap; }
  .tab-btn{
    background:none; border:1px solid var(--line); color:var(--grey);
    padding:9px 16px; border-radius:999px; font-size:12.5px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase;
  }
  .tab-btn.active{ color:var(--black); background:var(--gold); border-color:var(--gold); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }
  .save-msg{ color:var(--gold); font-size:12.5px; margin-left:10px; }
</style>
</head>
<body>
  <nav class="topnav">
    <div class="brand">XPLOSIVE<span>.</span></div>
    <div class="navlinks" id="navlinks"></div>
  </nav>

  <main>
    <div class="page-head">
      <div class="eyebrow">Staff Only</div>
      <h1>Admin Panel</h1>
      <p>Edit the calendar, events, competitions, and supply links — changes are live immediately for parents.</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="events">Events</button>
      <button class="tab-btn" data-tab="competitions">Competitions</button>
      <button class="tab-btn" data-tab="supplies">Supplies</button>
      <button class="tab-btn" data-tab="schedule">Calendar (JSON)</button>
    </div>

    <!-- EVENTS -->
    <div class="tab-panel active" id="panel-events">
      <div id="eventsList"></div>
      <button class="btn btn-ghost" id="addEvent">+ Add Event</button>
      <div style="margin-top:18px;">
        <button class="btn btn-primary" id="saveEvents">Save Events</button>
        <span class="save-msg" id="eventsMsg"></span>
      </div>
    </div>

    <!-- COMPETITIONS -->
    <div class="tab-panel" id="panel-competitions">
      <div id="compList"></div>
      <button class="btn btn-ghost" id="addComp">+ Add Competition</button>
      <div style="margin-top:18px;">
        <button class="btn btn-primary" id="saveComps">Save Competitions</button>
        <span class="save-msg" id="compMsg"></span>
      </div>
    </div>

    <!-- SUPPLIES -->
    <div class="tab-panel" id="panel-supplies">
      <div id="supList"></div>
      <button class="btn btn-ghost" id="addSup">+ Add Supply Link</button>
      <div style="margin-top:18px;">
        <button class="btn btn-primary" id="saveSup">Save Supplies</button>
        <span class="save-msg" id="supMsg"></span>
      </div>
    </div>

    <!-- SCHEDULE (raw JSON, since it's nested by day) -->
    <div class="tab-panel" id="panel-schedule">
      <p style="color:var(--grey); font-size:13px; margin-bottom:12px;">
        Edit the weekly schedule as JSON. Each day has a list of classes with a time and name.
      </p>
      <textarea id="scheduleJson" style="width:100%; min-height:420px; background:#141017; border:1px solid var(--line); color:var(--white); border-radius:10px; padding:16px; font-family:monospace; font-size:13px;"></textarea>
      <div style="margin-top:14px;">
        <button class="btn btn-primary" id="saveSchedule">Save Calendar</button>
        <span class="save-msg" id="scheduleMsg"></span>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    let user;
    let events = [], comps = [], supplies = [], schedule = {};

    function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8); }

    // ---------- EVENTS ----------
    function renderEvents(){
      document.getElementById('eventsList').innerHTML = events.map((e,i) => `
        <div class="admin-item">
          <div class="field"><label>Tag</label><input data-i="${i}" data-f="tag" value="${e.tag}"></div>
          <div class="field"><label>Title</label><input data-i="${i}" data-f="title" value="${e.title}"></div>
          <div class="field"><label>Date</label><input data-i="${i}" data-f="date" value="${e.date}"></div>
          <div class="field"><label>Location</label><input data-i="${i}" data-f="location" value="${e.location}"></div>
          <div class="field"><label>Description</label><textarea data-i="${i}" data-f="description">${e.description}</textarea></div>
          <div class="row-actions"><button class="btn btn-danger" data-del="${i}">Remove</button></div>
        </div>
      `).join('');
      document.querySelectorAll('#eventsList input, #eventsList textarea').forEach(el => {
        el.addEventListener('input', () => { events[el.dataset.i][el.dataset.f] = el.value; });
      });
      document.querySelectorAll('#eventsList [data-del]').forEach(btn => {
        btn.addEventListener('click', () => { events.splice(btn.dataset.del,1); renderEvents(); });
      });
    }
    document.getElementById('addEvent').addEventListener('click', () => {
      events.push({ id: uid('evt'), tag:'Event', title:'New Event', date:'TBD', location:'TBD', description:'' });
      renderEvents();
    });
    document.getElementById('saveEvents').addEventListener('click', async () => {
      await fetch('/api/events', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(events) });
      flash('eventsMsg');
    });

    // ---------- COMPETITIONS ----------
    function renderComps(){
      document.getElementById('compList').innerHTML = comps.map((c,i) => `
        <div class="admin-item">
          <div class="field"><label>Name</label><input data-i="${i}" data-f="name" value="${c.name}"></div>
          <div class="field"><label>Date</label><input data-i="${i}" data-f="date" value="${c.date}"></div>
          <div class="field"><label>Location</label><input data-i="${i}" data-f="location" value="${c.location}"></div>
          <div class="field">
            <label>Status</label>
            <select data-i="${i}" data-f="status">
              <option value="tbd" ${c.status==='tbd'?'selected':''}>TBD</option>
              <option value="confirmed" ${c.status==='confirmed'?'selected':''}>Confirmed</option>
            </select>
          </div>
          <div class="row-actions"><button class="btn btn-danger" data-del="${i}">Remove</button></div>
        </div>
      `).join('');
      document.querySelectorAll('#compList input, #compList select').forEach(el => {
        el.addEventListener('input', () => { comps[el.dataset.i][el.dataset.f] = el.value; });
        el.addEventListener('change', () => { comps[el.dataset.i][el.dataset.f] = el.value; });
      });
      document.querySelectorAll('#compList [data-del]').forEach(btn => {
        btn.addEventListener('click', () => { comps.splice(btn.dataset.del,1); renderComps(); });
      });
    }
    document.getElementById('addComp').addEventListener('click', () => {
      comps.push({ id: uid('comp'), name:'New Competition', location:'TBD', date:'TBD', status:'tbd' });
      renderComps();
    });
    document.getElementById('saveComps').addEventListener('click', async () => {
      await fetch('/api/competitions', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(comps) });
      flash('compMsg');
    });

    // ---------- SUPPLIES ----------
    function renderSup(){
      document.getElementById('supList').innerHTML = supplies.map((s,i) => `
        <div class="admin-item">
          <div class="field"><label>Category</label><input data-i="${i}" data-f="category" value="${s.category}"></div>
          <div class="field"><label>Title</label><input data-i="${i}" data-f="title" value="${s.title}"></div>
          <div class="field"><label>Description</label><textarea data-i="${i}" data-f="description">${s.description}</textarea></div>
          <div class="field"><label>Shop URL</label><input data-i="${i}" data-f="url" value="${s.url}" placeholder="https://..."></div>
          <div class="row-actions"><button class="btn btn-danger" data-del="${i}">Remove</button></div>
        </div>
      `).join('');
      document.querySelectorAll('#supList input, #supList textarea').forEach(el => {
        el.addEventListener('input', () => { supplies[el.dataset.i][el.dataset.f] = el.value; });
      });
      document.querySelectorAll('#supList [data-del]').forEach(btn => {
        btn.addEventListener('click', () => { supplies.splice(btn.dataset.del,1); renderSup(); });
      });
    }
    document.getElementById('addSup').addEventListener('click', () => {
      supplies.push({ id: uid('sup'), category:'Category', title:'New Item', description:'', url:'' });
      renderSup();
    });
    document.getElementById('saveSup').addEventListener('click', async () => {
      await fetch('/api/supplies', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(supplies) });
      flash('supMsg');
    });

    // ---------- SCHEDULE ----------
    document.getElementById('saveSchedule').addEventListener('click', async () => {
      try {
        const parsed = JSON.parse(document.getElementById('scheduleJson').value);
        await fetch('/api/schedule', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(parsed) });
        flash('scheduleMsg');
      } catch(e) {
        document.getElementById('scheduleMsg').textContent = 'Invalid JSON — not saved.';
        document.getElementById('scheduleMsg').style.color = 'var(--danger)';
      }
    });

    function flash(id){
      const el = document.getElementById(id);
      el.style.color = 'var(--gold)';
      el.textContent = 'Saved ✓';
      setTimeout(()=> el.textContent = '', 2000);
    }

    // ---------- TABS ----------
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    // ---------- INIT ----------
    initNav('/admin.html').then(async u => {
      if (!u) return;
      user = u;
      if (user.role !== 'admin') {
        document.querySelector('main').innerHTML = '<p>You do not have access to this page.</p>';
        return;
      }
      const [evRes, compRes, supRes, schRes] = await Promise.all([
        fetch('/api/events'), fetch('/api/competitions'), fetch('/api/supplies'), fetch('/api/schedule')
      ]);
      events = await evRes.json();
      comps = await compRes.json();
      supplies = await supRes.json();
      schedule = await schRes.json();

      renderEvents(); renderComps(); renderSup();
      document.getElementById('scheduleJson').value = JSON.stringify(schedule, null, 2);
    });
  </script>
</body>
</html>
